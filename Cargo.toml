[package]
name = "claude-mux"
version = "0.1.0"
edition = "2024"
autobins = false

[lib]
path = "lib.rs"

[[bin]]
name = "claude-mux"
path = "main.rs"

[[bin]]
name = "claude-muxd"
path = "claude-muxd.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
include_dir = "0.7.4"
libc = "0.2.190"
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "d2036baeb605d31d09a9e2ba6d0c923e04c34d54" }
pollster = "1.0.1"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
turso = { version = "0.8.3", default-features = false }
unicode-width = "0.2.2"
uuid = { version = "1.28.0", features = ["v4"] }
