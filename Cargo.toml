[package]
name = "claude-mux"
version = "0.2.1"
edition = "2024"
autobins = false

[lib]
path = "lib.rs"

[[bin]]
name = "claude-mux"
path = "main.rs"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
cliclack = "0.5.6"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.31"
include_dir = "0.7.4"
libc = "0.2.190"
portable-pty = "0.9.0"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.48.0", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
turso = { version = "0.8.3", default-features = false }
unicode-width = "0.2.2"
uuid = { version = "1.28.0", features = ["v4"] }
